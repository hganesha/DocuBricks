resources:
  apps:
    docubricks_onboarding:
      name: "DocuBricks Onboarding [${bundle.target}]"
      description: >
        Self-service onboarding wizard that guides new tenants from zero to
        first document processed. Implements the 9-screen state machine defined
        in ONBOARDING_SPEC.md. Persists state to a local JSON file until
        Lakebase is provisioned, then migrates to the onboarding_sessions table.

      source_code_path: apps/onboarding/

      config:
        command:
          - "streamlit"
          - "run"
          - "app.py"
          - "--server.port=8080"
          - "--server.headless=true"

        env:
          # Lakebase: only available after provision_lakebase step completes.
          # The app falls back to local JSON state if this is unset.
          - name: LAKEBASE_CONN
            valueFrom:
              secretRef:
                scope: ${var.secret_scope}
                key: lakebase-conn-string

          - name: DATABRICKS_HOST
            valueFrom:
              secretRef:
                scope: ${var.secret_scope}
                key: databricks-host

          - name: DATABRICKS_TOKEN
            valueFrom:
              secretRef:
                scope: ${var.secret_scope}
                key: databricks-sp-token

          - name: SQL_WH_HTTP_PATH
            valueFrom:
              secretRef:
                scope: ${var.secret_scope}
                key: sql-wh-http-path

          - name: PIPELINE_JOB_ID
            valueFrom:
              secretRef:
                scope: ${var.secret_scope}
                key: pipeline-job-id

          - name: GENIE_SPACE_ID_FS
            valueFrom:
              secretRef:
                scope: ${var.secret_scope}
                key: genie-space-id-fs

          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: ${var.otel_endpoint}

          - name: CATALOG_NAME
            value: ${var.catalog_name}

          - name: VERTICAL
            value: ${var.vertical}

      resources:
        cpu: "0.5"
        memory: "1Gi"

      tags:
        component: app
        app: onboarding
        managed_by: databricks_bundle
