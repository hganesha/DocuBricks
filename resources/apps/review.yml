resources:
  apps:
    docubricks_review:
      name: "DocuBricks Review [${bundle.target}]"
      description: >
        Human-in-the-loop review and correction application.
        Reviewers see the extracted fields, confidence scores, and the source
        document side-by-side. They can correct fields and approve or reject
        each document. Corrections feed back into the extraction audit log.

      source_code_path: apps/review/

      config:
        command:
          - "streamlit"
          - "run"
          - "app.py"
          - "--server.port=8080"
          - "--server.headless=true"

        env:
          - name: LAKEBASE_CONN
            valueFrom:
              secretRef:
                scope: ${var.secret_scope}
                key: lakebase-conn-string

          - name: DATABRICKS_HOST
            valueFrom:
              secretRef:
                scope: ${var.secret_scope}
                key: databricks-host

          - name: DATABRICKS_TOKEN
            valueFrom:
              secretRef:
                scope: ${var.secret_scope}
                key: databricks-sp-token

          - name: SQL_WH_HTTP_PATH
            valueFrom:
              secretRef:
                scope: ${var.secret_scope}
                key: sql-wh-http-path

          - name: PIPELINE_JOB_ID
            valueFrom:
              secretRef:
                scope: ${var.secret_scope}
                key: pipeline-job-id

          - name: GENIE_SPACE_ID_FS
            valueFrom:
              secretRef:
                scope: ${var.secret_scope}
                key: genie-space-id-fs

          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: ${var.otel_endpoint}

          - name: CATALOG_NAME
            value: ${var.catalog_name}

      resources:
        cpu: "0.5"
        memory: "1Gi"

      tags:
        component: app
        app: review
        managed_by: databricks_bundle
