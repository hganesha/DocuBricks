resources:
  jobs:
    bootstrap_05_vector_search:
      name: "DocuBricks — Bootstrap 05: Vector Search [${bundle.target}]"
      tasks:
        - task_key: run
          python_file:
            path: src/bootstrap/setup_vector_search.py
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 0
            spark_conf:
              catalog_name: ${var.catalog_name}
              secret_scope: ${var.secret_scope}
      max_concurrent_runs: 1
      timeout_seconds: 900
