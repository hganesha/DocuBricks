resources:
  jobs:
    fs_kyc_refresh:
      name: "DocuBricks — FS KYC Periodic Refresh [${bundle.target}]"

      schedule:
        # Every Monday at 06:00 UTC  (day-of-week field: 2 = Monday in Quartz)
        quartz_cron_expression: "0 0 6 ? * 2"
        timezone_id: "UTC"
        pause_status: PAUSED  # overridden to UNPAUSED in prod target

      tasks:
        - task_key: run_agent
          python_file:
            path: src/agents/fs/kyc_refresh.py
          existing_cluster_id: ${var.agent_cluster_id}
          libraries:
            - pypi:
                package: psycopg2-binary

      email_notifications:
        on_failure: []

      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 1800

      tags:
        vertical: fs
        agent: kyc_refresh
        team: docubricks-platform
