name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ===========================================================================
  # STAGE 1 — STAGING
  # ===========================================================================

  deploy-staging:
    name: "[Staging] Bundle deploy"
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_PORTAL_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle (staging)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGING }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGING }}
        run: databricks bundle validate --target staging

      - name: Deploy bundle (staging)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGING }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGING }}
        run: databricks bundle deploy --target staging

  bootstrap-staging:
    name: "[Staging] Bootstrap"
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: staging
      url: ${{ vars.STAGING_PORTAL_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Bootstrap 00 — Unity Catalog
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGING }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGING }}
        run: databricks bundle run bootstrap_00_setup_uc --target staging --no-wait=false

      - name: Bootstrap 01 — Schema Registry
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGING }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGING }}
        run: databricks bundle run bootstrap_01_schema_registry --target staging --no-wait=false

      - name: Bootstrap 02 — Load Schemas
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGING }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGING }}
        run: databricks bundle run bootstrap_02_load_schemas --target staging --no-wait=false

      - name: Bootstrap 03 — Monitoring
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGING }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGING }}
        run: databricks bundle run bootstrap_03_monitoring --target staging --no-wait=false

      - name: Bootstrap 04 — Genie
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGING }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGING }}
        run: databricks bundle run bootstrap_04_genie --target staging --no-wait=false

      - name: Bootstrap 05 — Vector Search
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGING }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGING }}
        run: databricks bundle run bootstrap_05_vector_search --target staging --no-wait=false

  e2e-staging:
    name: "[Staging] E2E smoke test"
    runs-on: ubuntu-latest
    needs: bootstrap-staging
    environment:
      name: staging
      url: ${{ vars.STAGING_PORTAL_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt psycopg2-binary requests databricks-sdk

      - name: Create fixture placeholder
        run: |
          [ -s tests/fixtures/sample_mortgage.pdf ] || \
            python -c "open('tests/fixtures/sample_mortgage.pdf','wb').write(b'%PDF-1.4 staging-smoke')"

      - name: Run E2E smoke test (staging)
        env:
          DATABRICKS_HOST:   ${{ secrets.DATABRICKS_HOST_STAGING }}
          DATABRICKS_TOKEN:  ${{ secrets.DATABRICKS_TOKEN_STAGING }}
          LAKEBASE_CONN:     ${{ secrets.LAKEBASE_CONN_STAGING }}
          SQL_WH_HTTP_PATH:  ${{ secrets.SQL_WH_HTTP_PATH_STAGING }}
          PIPELINE_JOB_ID:   ${{ secrets.PIPELINE_JOB_ID_STAGING }}
          GENIE_SPACE_ID_FS: ${{ secrets.GENIE_SPACE_ID_FS_STAGING }}
          CATALOG_NAME:      docubricks_staging
        run: python tests/e2e/smoke_test.py

  # ===========================================================================
  # MANUAL GATE — staging approved before prod can proceed
  # ===========================================================================

  staging-gate:
    name: "[Gate] Staging approved — promote to prod?"
    runs-on: ubuntu-latest
    needs: e2e-staging
    environment:
      name: production-gate   # configure required reviewers in repo settings
    steps:
      - name: Staging gate passed
        run: echo "Staging gate approved. Proceeding to production."

  # ===========================================================================
  # STAGE 2 — PRODUCTION
  # ===========================================================================

  deploy-prod:
    name: "[Prod] Bundle deploy"
    runs-on: ubuntu-latest
    needs: staging-gate
    environment:
      name: production
      url: ${{ vars.PROD_PORTAL_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle (prod)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: databricks bundle validate --target prod

      - name: Deploy bundle (prod)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: databricks bundle deploy --target prod

  bootstrap-prod:
    name: "[Prod] Bootstrap"
    runs-on: ubuntu-latest
    needs: deploy-prod
    environment:
      name: production
      url: ${{ vars.PROD_PORTAL_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Bootstrap 00 — Unity Catalog
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: databricks bundle run bootstrap_00_setup_uc --target prod --no-wait=false

      - name: Bootstrap 01 — Schema Registry
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: databricks bundle run bootstrap_01_schema_registry --target prod --no-wait=false

      - name: Bootstrap 02 — Load Schemas
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: databricks bundle run bootstrap_02_load_schemas --target prod --no-wait=false

      - name: Bootstrap 03 — Monitoring
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: databricks bundle run bootstrap_03_monitoring --target prod --no-wait=false

      - name: Bootstrap 04 — Genie
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: databricks bundle run bootstrap_04_genie --target prod --no-wait=false

      - name: Bootstrap 05 — Vector Search
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: databricks bundle run bootstrap_05_vector_search --target prod --no-wait=false

  e2e-prod:
    name: "[Prod] E2E smoke test"
    runs-on: ubuntu-latest
    needs: bootstrap-prod
    environment:
      name: production
      url: ${{ vars.PROD_PORTAL_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt psycopg2-binary requests databricks-sdk

      - name: Create fixture placeholder
        run: |
          [ -s tests/fixtures/sample_mortgage.pdf ] || \
            python -c "open('tests/fixtures/sample_mortgage.pdf','wb').write(b'%PDF-1.4 prod-smoke')"

      - name: Run E2E smoke test (prod)
        env:
          DATABRICKS_HOST:   ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN:  ${{ secrets.DATABRICKS_TOKEN_PROD }}
          LAKEBASE_CONN:     ${{ secrets.LAKEBASE_CONN_PROD }}
          SQL_WH_HTTP_PATH:  ${{ secrets.SQL_WH_HTTP_PATH_PROD }}
          PIPELINE_JOB_ID:   ${{ secrets.PIPELINE_JOB_ID_PROD }}
          GENIE_SPACE_ID_FS: ${{ secrets.GENIE_SPACE_ID_FS_PROD }}
          CATALOG_NAME:      docubricks_prod
        run: python tests/e2e/smoke_test.py

  # ---------------------------------------------------------------------------
  # Create GitHub Release with release notes
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: e2e-prod
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
