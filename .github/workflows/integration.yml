name: Integration

on:
  push:
    branches:
      - main

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false   # never cancel a running deploy

env:
  PYTHON_VERSION: "3.11"
  DATABRICKS_TARGET: dev

jobs:
  # ---------------------------------------------------------------------------
  # Deploy bundle to dev
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Bundle deploy (dev)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: databricks bundle validate --target dev

      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: databricks bundle deploy --target dev

  # ---------------------------------------------------------------------------
  # Run bootstrap jobs sequentially
  # ---------------------------------------------------------------------------
  bootstrap-dev:
    name: Run bootstrap (dev)
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Bootstrap 00 — Setup Unity Catalog
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          databricks bundle run bootstrap_00_setup_uc \
            --target dev \
            --no-wait=false

      - name: Bootstrap 01 — Schema Registry
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          databricks bundle run bootstrap_01_schema_registry \
            --target dev \
            --no-wait=false

      - name: Bootstrap 02 — Load Schemas
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          databricks bundle run bootstrap_02_load_schemas \
            --target dev \
            --no-wait=false

      - name: Bootstrap 03 — Monitoring
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          databricks bundle run bootstrap_03_monitoring \
            --target dev \
            --no-wait=false

      - name: Bootstrap 04 — Genie
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          databricks bundle run bootstrap_04_genie \
            --target dev \
            --no-wait=false

      - name: Bootstrap 05 — Vector Search
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          databricks bundle run bootstrap_05_vector_search \
            --target dev \
            --no-wait=false

  # ---------------------------------------------------------------------------
  # Run integration test suite (Lakebase lifecycle)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: bootstrap-dev
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest psycopg2-binary

      - name: Run integration tests
        env:
          LAKEBASE_CONN: ${{ secrets.LAKEBASE_CONN_DEV }}
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            -m integration

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: .pytest_cache/
