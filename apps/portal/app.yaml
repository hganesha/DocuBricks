command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8080"
  - --server.headless
  - "true"

dependencies:
  - requirements.txt

env:
  - name: DATABRICKS_HOST
    valueFrom:
      secretRef:
        scope: docubricks-prod
        key: DATABRICKS_HOST
  - name: DATABRICKS_TOKEN
    valueFrom:
      secretRef:
        scope: docubricks-prod
        key: DATABRICKS_TOKEN
  - name: LAKEBASE_CONN
    valueFrom:
      secretRef:
        scope: docubricks-prod
        key: LAKEBASE_CONN
  - name: SQL_WH_HTTP_PATH
    valueFrom:
      secretRef:
        scope: docubricks-prod
        key: SQL_WH_HTTP_PATH
  - name: GENIE_SPACE_ID_FS
    valueFrom:
      secretRef:
        scope: docubricks-prod
        key: GENIE_SPACE_ID_FS
  - name: PIPELINE_JOB_ID
    valueFrom:
      secretRef:
        scope: docubricks-prod
        key: PIPELINE_JOB_ID

resources:
  sql_warehouses:
    - id: docubricks-serverless-wh
      permission: CAN_USE
  jobs:
    - id: docubricks-main-pipeline
      permission: CAN_MANAGE_RUN
  volumes:
    - name: docubricks_prod.raw_landing.documents
      permission: READ_WRITE
  serving_endpoints:
    - name: databricks-bge-large-en
      permission: CAN_QUERY
